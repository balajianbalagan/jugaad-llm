services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
